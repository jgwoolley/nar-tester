# processorClass: fully-qualified class name of the processor inside the NAR to test.
processorClass: org.apache.nifi.processors.example.MyProcessor

# properties: keyed by the property's display name, exactly as it appears
# in the NiFi UI / as defined via PropertyDescriptor.Builder().name(...).
properties:
  Some Property: some-value
  Another Property: "${literal-value}"

# attributes: flowfile attributes to set on the single input flowfile
# before running the processor. "filename" defaults to the input file's
# name if not set here.
attributes:
  filename: input.json
  mime.type: application/json

# relationships: which relationships to capture output from. Omit (or
# leave empty) to capture every relationship the processor declares.
relationships:
  - success
  - failure

# runIterations: how many times to call the processor's onTrigger (default 1).
runIterations: 1

# controllerServices: instantiated, configured, and enabled before the
# processor runs. A processor property that references a controller service
# (e.g. "DBCP Connection Pool") should use that service's "identifier" as
# its value in the properties map above.
controllerServices:
  - identifier: my-service
    implementationClass: org.apache.nifi.example.MyControllerServiceImpl
    properties:
      Some Service Property: value

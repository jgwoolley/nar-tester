# A working example against a real, off-the-shelf processor
# (org.apache.nifi.processors.attributes.UpdateAttribute, bundled in
# nifi/lib/nifi-update-attribute-nar-*.nar) -- see test.sh at the repo root.

processorClass: org.apache.nifi.processors.attributes.UpdateAttribute

properties:
  greeting: hello

attributes:
  filename: example-input.txt

relationships:
  - success

runIterations: 1
